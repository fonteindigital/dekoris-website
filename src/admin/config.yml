backend:
  name: github
  repo: fonteindigital/dekoris-website
  branch: main
  base_url: https://www.dekoris.com.na
  auth_endpoint: api/auth

media_folder: "src/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "blog"
    label: "Inspiration Articles"
    folder: "src/content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["Tips & Guides", "Trends", "Product Spotlights", "Behind the Scenes"] }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }

  - name: "products"
    label: "Products"
    folder: "src/content/products"
    create: true
    fields:
      - { label: "Product Name", name: "title", widget: "string" }
      - { label: "URL Slug", name: "slug", widget: "string", hint: "Used in the URL: /shop/{slug}/. Lowercase, hyphens only." }
      - { label: "Starting Price (from)", name: "price", widget: "number", value_type: "float", hint: "Shown as 'from N$X' on the catalog card." }
      - { label: "Product Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "select", options: ["Blinds", "Curtains", "Wall Panelling", "Home Decor"] }
      - { label: "Short Description", name: "description", widget: "text" }
      - { label: "Long Description (detail page)", name: "longDescription", widget: "text", required: false }
      - label: "Available Colours"
        name: "colours"
        widget: "list"
        field: { label: "Colour", name: "colour", widget: "string" }
      - { label: "Motorised Option", name: "motorised", widget: "boolean", default: true }
      - { label: "Display Order", name: "order", widget: "number", default: 10 }
      - label: "Standard Sizes"
        name: "sizes"
        widget: "list"
        summary: "{{ fields.name }} — N${{ fields.price }}"
        fields:
          - { label: "Size Name (include dimensions)", name: "name", widget: "string", hint: "e.g. 'Small (600 × 1000 mm)'" }
          - { label: "Price (N$)", name: "price", widget: "number", value_type: "float" }
          - { label: "SKU", name: "sku", widget: "string", hint: "Used as the cart line ID — lowercase-hyphenated. e.g. roman-blinds-small" }

  - name: "gallery"
    label: "Gallery Images"
    folder: "src/content/gallery"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Image", name: "image", widget: "image" }
      - { label: "Category", name: "category", widget: "select", options: ["Blinds", "Curtains", "Wall Panelling", "Home Decor", "Spaces", "Completed Projects"] }
      - { label: "Alt Text", name: "alt", widget: "string" }

  - name: "faqs"
    label: "FAQs"
    folder: "src/content/faqs"
    create: true
    fields:
      - { label: "Question", name: "title", widget: "string" }
      - { label: "Answer", name: "answer", widget: "text" }
      - { label: "Category", name: "category", widget: "select", options: ["General", "Products", "Pricing & Orders", "Installation & Aftercare"] }
      - { label: "Order", name: "order", widget: "number", default: 10 }

  - name: "settings"
    label: "Site Settings"
    files:
      - label: "General Settings"
        name: "general"
        file: "src/_data/settings.json"
        fields:
          - { label: "Site Name", name: "siteName", widget: "string", default: "Dekoris" }
          - { label: "Tagline", name: "tagline", widget: "string", default: "Crafting Beautiful Spaces" }
          - { label: "Header Logo", name: "logo", widget: "image", required: false, hint: "Used in the top navigation bar (dark background)." }
          - { label: "Footer Logo", name: "logoDark", widget: "image", required: false, hint: "Used in the page footer (dark background)." }
          - { label: "Phone", name: "phone", widget: "string", required: false }
          - { label: "Email", name: "email", widget: "string", required: false }
          - { label: "WhatsApp Number", name: "whatsapp", widget: "string", required: false }
          - { label: "Address", name: "address", widget: "string", required: false }
